<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شوالیه شجاع | Idle Knight RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- انیمیشن‌ها از فایل خارجی بارگذاری میشن -->
    <link rel="stylesheet" href="animations.css">

    <style>
        :root {
            --bg: #0b0f19;
            --card: #151c2c;
            --accent: #6366f1;
            --gold: #f59e0b;
            --hp-p: #10b981;
            --hp-e: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: var(--bg);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* این رو اضافه کن */
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        .game-card {
            width: 100%;
            max-width: 410px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        /* هدر جمع و جور وضعیت */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.25);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .badge-group { display: flex; gap: 8px; }
        .badge {
            background: rgba(255,255,255,0.06);
            padding: 3px 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* کنترل فشرده دانجن */
        .dungeon-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .d-ctrl { display: flex; align-items: center; gap: 4px; }
        .d-btn {
            background: #20293d;
            border: 1px solid var(--border);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: 900;
            cursor: pointer;
        }
        .d-input {
            width: 44px;
            height: 28px;
            background: #0b0f19;
            border: 1px solid var(--border);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            font-weight: 700;
        }

        /* نوار و آرنای بازی */
        .arena {
            background: rgba(0,0,0,0.35);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .enemy-avatar {
            font-size: 3.5rem;
            transition: transform 0.1s;
            cursor: pointer;
        }
        .enemy-title { font-weight: 800; font-size: 0.95rem; color: #fca5a5; }

        /* نوارهای جان مشترک */
        .hp-box { width: 100%; display: flex; flex-direction: column; gap: 3px; }
        .hp-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-dim); }
        .hp-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
            overflow: hidden;
        }
        .hp-fill { height: 100%; width: 100%; transition: width 0.2s linear; }
        .hp-p { background: var(--hp-p); }
        .hp-e { background: var(--hp-e); }

        /* باکس آمار و لاگ جمع و جور */
        .stats-strip {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .stat-item {
            background: rgba(255,255,255,0.03);
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }
        .log-box {
            background: rgba(0,0,0,0.25);
            border-right: 3px solid var(--accent);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.74rem;
            color: var(--text-dim);
            height: 28px;
            line-height: 16px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* دکمه‌های اصلی مخصوص تاچ موبایل */
        .actions {
            display: grid;
            grid-template-columns: 1.6fr 1fr 1fr;
            gap: 8px;
            margin-top: 2px;
        }
        .btn {
            border: none;
            padding: 12px 6px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-atk { background: var(--accent); }
        .btn-auto { background: #20293d; border: 1px solid var(--border); }
        .btn-auto.active { background: var(--hp-e); }
        .btn-shop { background: #78350f; color: #fde68a; }

        /* مودال شاپ */
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(11, 15, 25, 0.98);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .modal.open { opacity: 1; pointer-events: auto; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; }
        .tabs { display: flex; gap: 6px; overflow-x: auto; }
        .tab-btn {
            background: #1b2333;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active { background: var(--accent); color: #fff; }
        .shop-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .shop-row {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }
        .buy-btn {
            background: var(--gold);
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }
        .buy-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="game-card" id="gameCard">
    <!-- وضعیت شوالیه -->
    <div class="top-row">
        <div style="display:flex; align-items:center; gap:6px;">
            <span>🛡️ شوالیه</span>
            <span style="color:var(--text-dim); font-size:0.75rem;">(Lv.<span id="playerLevelVal">1</span>)</span>
        </div>
        <div class="badge-group">
            <div class="badge" style="color:#818cf8;">XP: <span id="xpVal">0</span></div>
            <div class="badge" style="color:var(--gold);">🪙 <span id="goldVal">50</span></div>
        </div>
    </div>

    <!-- دانجن فشرده -->
    <div class="dungeon-strip">
        <div>
            <span>🕳️ طبقه دانجن:</span>
            <strong id="dungeonLevelLabel">1</strong> / <span id="dungeonMaxLabel" style="color:var(--text-dim)">1</span>
        </div>
        <div class="d-ctrl">
            <button class="d-btn" onclick="changeDungeon(-1)">-</button>
            <input class="d-input" id="dungeonInput" type="number" min="1" value="1" onchange="setDungeonFromInput()">
            <button class="d-btn" onclick="changeDungeon(1)">+</button>
        </div>
    </div>

    <!-- میدان نبرد -->
    <div class="arena">
        <div class="enemy-avatar" id="enemyIcon" onclick="playerAttack()">👾</div>
        <div class="enemy-title" id="enemyName">Green Slime</div>
        
        <!-- جان دشمن -->
        <div class="hp-box">
            <div class="hp-meta">
                <span>جان دشمن</span>
                <span id="enemyHpText">100 / 100</span>
            </div>
            <div class="hp-bar"><div class="hp-fill hp-e" id="enemyHpFill"></div></div>
        </div>
    </div>

    <!-- جان قهرمان -->
    <div class="hp-box">
        <div class="hp-meta">
            <span>جان شما</span>
            <span id="playerHpText">150 / 150</span>
        </div>
        <div class="hp-bar"><div class="hp-fill hp-p" id="playerHpFill"></div></div>
    </div>

    <!-- آمار و لاگ -->
    <div class="stats-strip">
        <div class="stat-item"><span>⚔️ حمله:</span><span id="atkVal" style="color:#818cf8">10</span></div>
        <div class="stat-item"><span>🛡️ دفاع:</span><span id="defVal" style="color:#34d399">10</span></div>
    </div>
    <div class="log-box" id="combatLog">برای حمله روی دکمه یا هیولا ضربه بزن! ⚔️</div>

    <!-- دکمه‌ها -->
    <div class="actions">
        <button class="btn btn-atk" id="attackBtn" onclick="playerAttack()">
            <span>💥 حمله</span>
        </button>
        <button class="btn btn-auto" id="autoBtn" onclick="toggleAuto()">
            <span id="autoText">⚡ خودکار</span>
        </button>
        <button class="btn btn-shop" onclick="openShop()">
            <span>🛒 شاپ</span>
        </button>
        <!-- فوتر جدید -->
        <footer style="margin-top:15px; text-align:center; color:rgba(255,255,255,0.2); font-size:0.65rem; letter-spacing:0.5px;">
            V:0.0.2
        </footer>
    </div>

    <!-- فروشگاه ماژولار -->
    <div class="modal" id="shopModal">
        <div class="modal-head">
            <strong>🛒 بازارچه تجهیزات</strong>
            <button class="d-btn" onclick="closeShop()">✕</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="renderShop('swords', this)">⚔️ شمشیر</button>
            <button class="tab-btn" onclick="renderShop('shields', this)">🛡️ سپر</button>
            <button class="tab-btn" onclick="renderShop('armors', this)">🥋 زره</button>
            <button class="tab-btn" onclick="renderShop('potions', this)">🧪 معجون</button>
        </div>
        <div class="shop-list" id="shopList"></div>
    </div>
</div>

<script>
    // همون دیتای اورجینال خودت بدون دستکاری
    const SHOP_DATA = {
        swords: [
            { id: 'sw1', name: 'Wooden Sword', attack: 10, gold: 5 },
            { id: 'sw2', name: 'Bronze Dagger', attack: 25, gold: 10 },
            { id: 'sw3', name: 'Iron Broadsword', attack: 60, gold: 20 },
            { id: 'sw4', name: 'Steel Longsword', attack: 140, gold: 40 },
            { id: 'sw5', name: 'Mithril Blade', attack: 320, gold: 80 },
            { id: 'sw6', name: 'Dragonfang Saber', attack: 740, gold: 160 },
            { id: 'sw7', name: 'Excalibur', attack: 1700, gold: 320 }
        ],
        shields: [
            { id: 'sh1', name: 'Wooden Buckler', defense: 10, gold: 5 },
            { id: 'sh2', name: 'Bronze Guard', defense: 25, gold: 10 },
            { id: 'sh3', name: 'Iron Shield', defense: 60, gold: 20 },
            { id: 'sh4', name: 'Steel Aegis', defense: 140, gold: 40 },
            { id: 'sh5', name: 'Mithril Crest', defense: 320, gold: 80 },
            { id: 'sh6', name: 'Dragonscale Guard', defense: 740, gold: 160 },
            { id: 'sh7', name: 'Divine Bastion', defense: 1700, gold: 320 }
        ],
        armors: [
            { id: 'ar1', name: 'Leather Armor', max_hp: 10, gold: 5 },
            { id: 'ar2', name: 'Bronze Armor', max_hp: 25, gold: 10 },
            { id: 'ar3', name: 'Iron Armor', max_hp: 60, gold: 20 },
            { id: 'ar4', name: 'Steel Armor', max_hp: 140, gold: 40 },
            { id: 'ar5', name: 'Mithril Armor', max_hp: 320, gold: 80 },
            { id: 'ar6', name: 'Dragonscale Armor', max_hp: 740, gold: 160 },
            { id: 'ar7', name: 'Divine Plate', max_hp: 1700, gold: 320 }
        ],
        potions: [
            { id: 'po1', name: 'Minor Health Potion', heal: 50, gold: 10 },
            { id: 'po2', name: 'Lesser Health Potion', heal: 110, gold: 20 },
            { id: 'po3', name: 'Health Potion', heal: 240, gold: 40 },
            { id: 'po4', name: 'Greater Health Potion', heal: 530, gold: 80 },
            { id: 'po5', name: 'Superior Health Potion', heal: 1200, gold: 160 },
            { id: 'po6', name: 'Supreme Health Potion', heal: 2600, gold: 320 },
            { id: 'po7', name: 'Elixir of Immortality', heal: 5700, gold: 640 }
        ]
    };

    const ENEMIES = [
        { name: 'Green Slime', icon: '🟢', hp: 100, gold: 10, weight: 40 },
        { name: 'Goblin Scout', icon: '👺', hp: 200, gold: 20, weight: 25 },
        { name: 'Skeleton Warrior', icon: '💀', hp: 300, gold: 30, weight: 15 },
        { name: 'Orc Berserker', icon: '👹', hp: 400, gold: 40, weight: 10 },
        { name: 'Cave Troll', icon: '🧌', hp: 500, gold: 50, weight: 5 },
        { name: 'Shadow Knight', icon: '🤺', hp: 600, gold: 60, weight: 3 },
        { name: 'Lava Golem', icon: '🗿', hp: 700, gold: 70, weight: 1.5 },
        { name: 'Ancient Dragon', icon: '🐉', hp: 800, gold: 80, weight: 0.5 }
    ];

    let player = { name: 'Brave Knight', max_hp: 150, hp: 150, gold: 50, attack: 10, defense: 10, level: 1, xp: 0 };
    let currentEnemy = null;
    let autoInterval = null;
    let dungeonLevel = 1;
    let maxUnlockedDungeon = 1;

    const BALANCE = {
        hpGrowth: 1.35, atkGrowth: 1.22, goldGrowth: 1.28, xpGrowth: 1.25,
        lowValuePerDiff: 0.5, minLowValue: 0.08
    };

    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function lowValueMultiplier() {
        const diff = Math.max(0, maxUnlockedDungeon - dungeonLevel);
        return Math.max(BALANCE.minLowValue, Math.pow(BALANCE.lowValuePerDiff, diff));
    }

    function scaleByDungeon(base, growth) {
        return base * Math.pow(growth, dungeonLevel - 1);
    }

    function weightedPick(arr) {
        const total = arr.reduce((s, e) => s + e.weight, 0);
        let r = Math.random() * total;
        for (const e of arr) {
            if (r < e.weight) return e;
            r -= e.weight;
        }
        return arr[0];
    }

    function updateDungeonUI() {
        document.getElementById('dungeonLevelLabel').innerText = dungeonLevel;
        document.getElementById('dungeonMaxLabel').innerText = maxUnlockedDungeon;
        const inp = document.getElementById('dungeonInput');
        inp.max = String(maxUnlockedDungeon);
        inp.value = String(dungeonLevel);
    }

    function setDungeonLevel(newLevel) {
        dungeonLevel = clamp(Number(newLevel || 1), 1, maxUnlockedDungeon);
        updateDungeonUI();
        spawnEnemy(true);
        log(`🕳️ دانجن روی طبقه ${dungeonLevel} تنظیم شد.`);
    }

    function changeDungeon(delta) { setDungeonLevel(dungeonLevel + delta); }
    function setDungeonFromInput() { setDungeonLevel(document.getElementById('dungeonInput').value); }

    function xpToNextLevel(level) {
        return Math.round(60 * Math.pow(1.4, level - 1));
    }

    function addXP(amount) {
        player.xp += amount;
        while (player.xp >= xpToNextLevel(player.level)) {
            player.xp -= xpToNextLevel(player.level);
            player.level++;
            player.max_hp += 12;
            player.attack += 2;
            player.defense += 1;
            player.hp = player.max_hp;
            log(`✨ لول‌آپ! شدی Lv.${player.level}`);
        }
    }

    function spawnEnemy(resetHp) {
        const t = weightedPick(ENEMIES);
        const hp = Math.round(scaleByDungeon(t.hp, BALANCE.hpGrowth));
        const baseAtk = Math.max(10, Math.floor(t.hp / 10));
        const atk = Math.max(1, Math.round(scaleByDungeon(baseAtk, BALANCE.atkGrowth)));
        const lowM = lowValueMultiplier();
        const gold = Math.max(1, Math.round(scaleByDungeon(t.gold, BALANCE.goldGrowth) * lowM));
        const xpBase = Math.max(1, Math.round(scaleByDungeon(t.gold, BALANCE.xpGrowth) * lowM));

        currentEnemy = {
            name: `${t.name} (Lv.${dungeonLevel})`,
            icon: t.icon,
            maxHp: hp,
            currentHp: hp,
            attack: atk,
            gold: gold,
            xp: xpBase
        };

        updateUI();
    }

    function playerAttack() {
        if (!currentEnemy) return;

        // انیمیشن با کلاس فایل خارجی
        const enemyEl = document.getElementById('enemyIcon');
        enemyEl.classList.add('hit');
        setTimeout(() => enemyEl.classList.remove('hit'), 150);

        const dmg = player.attack;
        currentEnemy.currentHp = Math.max(0, currentEnemy.currentHp - dmg);
        log(`💥 تو ${dmg} آسیب زدی!`);

        if (currentEnemy.currentHp <= 0) {
            player.gold += currentEnemy.gold;
            addXP(currentEnemy.xp);
            player.hp = Math.min(player.max_hp, player.hp + 50);

            if (dungeonLevel === maxUnlockedDungeon) {
                maxUnlockedDungeon++;
            }
            log(`🎉 پیروزی! +${currentEnemy.gold}🪙 و +${currentEnemy.xp}XP`);
            updateDungeonUI();
            spawnEnemy(true);
        } else {
            setTimeout(enemyAttack, 250);
        }
        updateUI();
    }

    function enemyAttack() {
        if (!currentEnemy || currentEnemy.currentHp <= 0) return;

        const finalDmg = Math.max(1, currentEnemy.attack - Math.floor(player.defense / 2));
        player.hp = Math.max(0, player.hp - finalDmg);

        // انیمیشن shake فایل خارجی
        const card = document.getElementById('gameCard');
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 250);

        log(`🩸 ${currentEnemy.name} مقدار ${finalDmg} آسیب زد!`);

        if (player.hp <= 0) {
            log(`☠️ شکست خوردی! با جون پر برگشتی.`);
            player.hp = player.max_hp;
            if (autoInterval) toggleAuto();
        }
        updateUI();
    }

    function toggleAuto() {
        const autoBtn = document.getElementById('autoBtn');
        const autoText = document.getElementById('autoText');

        if (autoInterval) {
            clearInterval(autoInterval);
            autoInterval = null;
            autoBtn.classList.remove('active');
            autoText.innerText = '⚡ خودکار';
        } else {
            autoInterval = setInterval(playerAttack, 600);
            autoBtn.classList.add('active');
            autoText.innerText = '⏸️ توقف';
        }
    }

    function updateUI() {
        document.getElementById('goldVal').innerText = player.gold;
        document.getElementById('atkVal').innerText = player.attack;
        document.getElementById('defVal').innerText = player.defense;
        document.getElementById('xpVal').innerText = player.xp;
        document.getElementById('playerLevelVal').innerText = player.level;

        document.getElementById('playerHpText').innerText = `${player.hp} / ${player.max_hp}`;
        document.getElementById('playerHpFill').style.width = `${Math.max(0, (player.hp / player.max_hp) * 100)}%`;

        if (currentEnemy) {
            document.getElementById('enemyName').innerText = currentEnemy.name;
            document.getElementById('enemyIcon').innerText = currentEnemy.icon;
            document.getElementById('enemyHpText').innerText = `${currentEnemy.currentHp} / ${currentEnemy.maxHp}`;
            document.getElementById('enemyHpFill').style.width = `${Math.max(0, (currentEnemy.currentHp / currentEnemy.maxHp) * 100)}%`;
        }
    }

    function log(msg) { document.getElementById('combatLog').innerText = msg; }

    let currentCategory = 'swords';
    function openShop() {
        document.getElementById('shopModal').classList.add('open');
        renderShop('swords', document.querySelector('.tab-btn'));
    }
    function closeShop() { document.getElementById('shopModal').classList.remove('open'); }

    function renderShop(category, btn) {
        currentCategory = category;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');

        const list = document.getElementById('shopList');
        list.innerHTML = '';

        SHOP_DATA[category].forEach(item => {
            let statText = '';
            if (item.attack) statText = `+${item.attack} Atk`;
            if (item.defense) statText = `+${item.defense} Def`;
            if (item.max_hp) statText = `+${item.max_hp} Max HP`;
            if (item.heal) statText = `+${item.heal} HP`;

            const canBuy = player.gold >= item.gold;
            const el = document.createElement('div');
            el.className = 'shop-row';
            el.innerHTML = `
                <div>
                    <div><strong>${item.name}</strong></div>
                    <div style="font-size:0.7rem; color:#34d399">${statText}</div>
                </div>
                <button class="buy-btn" ${canBuy ? '' : 'disabled'} onclick="buyItem('${category}', '${item.id}')">
                    🪙 ${item.gold}
                </button>
            `;
            list.appendChild(el);
        });
    }

    function buyItem(category, itemId) {
        const item = SHOP_DATA[category].find(i => i.id === itemId);
        if (!item || player.gold < item.gold) return;

        player.gold -= item.gold;

        if (category === 'potions') {
            player.hp = Math.min(player.max_hp, player.hp + item.heal);
            log(`🧪 استفاده از ${item.name}`);
        } else if (category === 'armors') {
            player.max_hp += item.max_hp;
            player.hp += item.max_hp;
            log(`🥋 پوشیدن ${item.name}`);
        } else if (category === 'swords') {
            player.attack = item.attack;
            log(`⚔️ مجهز شدی به ${item.name}`);
        } else if (category === 'shields') {
            player.defense = item.defense;
            log(`🛡️ مجهز شدی به ${item.name}`);
        }

        updateUI();
        renderShop(category);
    }

    updateDungeonUI();
    spawnEnemy(true);
    updateUI();
</script>
</body>
</html>
